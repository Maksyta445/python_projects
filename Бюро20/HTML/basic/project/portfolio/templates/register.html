{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 0 auto;">
    <h2>Регистрация</h2>
    <form method="post">
        <input type="text" name="username" placeholder="Имя пользователя" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Пароль (мин. 6 символов)" required>
        <input type="password" name="confirm" placeholder="Повторите пароль" required>
        <button type="submit">Создать аккаунт</button>
    </form>
    <p style="margin-top: 15px;" class="muted">
        Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
    </p>
</div>
{% endblock %}
